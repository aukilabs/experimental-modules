[package]
name = "pnp-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C FFI bindings for PnP pose estimation"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# no default features: avoids nalgebra/std which pulls in matrixmultiply + simba/wide
pnp-core = { path = "../pnp-core", default-features = false }

[build-dependencies]
cbindgen = "0.27"
