[package]
name = "pnp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust PnP (Perspective-n-Point) pose estimation"

[features]
default = ["std"]
std = ["nalgebra/std"]

[dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["alloc", "libm"] }
libm = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
